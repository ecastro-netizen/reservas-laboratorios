<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reserva de Laboratorios</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #eef2f7;
    text-align: center;
}

header {
    background: #1e3a5f;
    color: white;
    padding: 20px;
}

h1 {
    margin: 0;
}

.botones {
    margin: 25px;
}

.botones button {
    padding: 12px 20px;
    margin: 8px;
    border: none;
    border-radius: 8px;
    background: #2b7cff;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.botones button:hover {
    background: #174ecf;
}

.contenedor {
    width: 95%;
    margin: auto;
    background: white;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

iframe {
    width: 100%;
    height: 650px;
    border: none;
}
</style>

<script>
function mostrarLab(lab) {
    document.getElementById("lab101").style.display = "none";
    document.getElementById("lab102").style.display = "none";
    document.getElementById("lab103").style.display = "none";

    document.getElementById(lab).style.display = "block";
}
</script>

</head>

<body>

<header>
<h1>Reserva de Laboratorios de Informática</h1>
</header>

<div class="botones">
    <button onclick="mostrarLab('lab101')">Laboratorio 101</button>
    <button onclick="mostrarLab('lab102')">Laboratorio 102</button>
    <button onclick="mostrarLab('lab103')">Laboratorio 103</button>
</div>

<div class="contenedor">

    <!-- LAB 101 -->
    <div id="lab101">
        <iframe src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2cbI0xfoGSxQocq_wpL__KLpnNvt9-xJwe4tusOPyl6ocssmiuQ0dyRABNyy9Fug7UovfwjtAT?gv=true"></iframe>
    </div>

    <!-- LAB 102 -->
    <div id="lab102" style="display:none;">
        <iframe src="https://calendar.google.com/calendar/appointments/schedules/TU_LINK_DEL_LAB_102?gv=true"></iframe>
    </div>

    <!-- LAB 103 -->
    <div id="lab103" style="display:none;">
        <iframe src="AQUI_LINK_103"></iframe>
    </div>

</div>

</body>
</html>
