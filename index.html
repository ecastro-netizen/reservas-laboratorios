<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reserva de Laboratorios</title>

<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    background: linear-gradient(135deg, #eef2f7, #d9e2ec);
}

/* HEADER */
header {
    background: linear-gradient(90deg, #1e3a5f, #2b7cff);
    color: white;
    padding: 25px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.logo {
    width: 120px;
    margin-bottom: 10px;
}

.titulo-principal {
    font-size: 24px;
    font-weight: bold;
}

/* BOTONES */
.botones {
    text-align: center;
    margin: 25px 0 10px;
}

.botones button {
    padding: 14px 28px;
    margin: 10px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(135deg, #2b7cff, #174ecf);
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.botones button:hover {
    transform: translateY(-3px);
    background: linear-gradient(135deg, #174ecf, #0d3a9e);
    box-shadow: 0 6px 15px rgba(0,0,0,0.3);
}

/* DESCRIPCIÓN */
.descripcion {
    text-align: center;
    font-size: 16px;
    margin-bottom: 20px;
    color: #333;
}

/* CONTENEDOR */
.contenedor {
    width: 95%;
    max-width: 1200px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
}

/* TITULO LAB */
.titulo-lab {
    text-align: center;
    font-size: 20px;
    margin-bottom: 15px;
    color: #1e3a5f;
    font-weight: bold;
}

iframe {
    width: 100%;
    height: 650px;
    border: none;
    border-radius: 10px;
}
</style>

<script>
function mostrarLab(lab) {

    if (lab === "lab201") {
        alert("Este laboratorio es de uso exclusivo para estudiantes de 1° a 4° básico.");
    }

    document.getElementById("lab101").style.display = "none";
    document.getElementById("lab102").style.display = "none";
    document.getElementById("lab201").style.display = "none";

    document.getElementById(lab).style.display = "block";
}
</script>

</head>

<body>

<header>
    <!-- IMPORTANTE: asegúrate que el nombre del archivo coincida -->
    <img src="03 Logo acacios COEMCO CMYK (9).png" class="logo">
    <div class="titulo-principal">Sistema de Reserva de Laboratorios</div>
</header>

<div class="botones">
    <button onclick="mostrarLab('lab101')">Laboratorio -101</button>
    <button onclick="mostrarLab('lab102')">Laboratorio -102</button>
    <button onclick="mostrarLab('lab201')">Laboratorio 201 Prebásica</button>
</div>

<div class="descripcion">
    <p><b>Laboratorio -101:</b> Ubicado donde está la oficina de informática.</p>
    <p><b>Laboratorio -102:</b> Ubicado al frente de informática.</p>
    <p><b>Laboratorio 201:</b> Laboratorio de prebásica (solo estudiantes de 1° a 4° básico).</p>
</div>

<div class="contenedor">

    <!-- LAB -101 (ACTUALIZADO) -->
    <div id="lab101">
        <div class="titulo-lab">Laboratorio -101</div>
        <iframe src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ1yijX3eqzE4lBD7uVmn_9uvflj-KlsZuXv8FAbq40IMhItIckp2FtP8kNHfnImLWlcLBQbE4GV?gv=true"></iframe>
    </div>

    <!-- LAB -102 -->
    <div id="lab102" style="display:none;">
        <div class="titulo-lab">Laboratorio -102</div>
        <iframe src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ3NpC_fxMrUCFNd5Rq0pEFRk65xbhl6hSMPSxSO426cNTVU3BlxMiLqU1UhzfVv9WwoWDeHuV8L?gv=true"></iframe>
    </div>

    <!-- LAB 201 -->
    <div id="lab201" style="display:none;">
        <div class="titulo-lab">Laboratorio 201 Prebásica</div>
        <iframe src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2uLcmeOQiJhIRaRnHMfGFU28OzTAw-1pvJetPbjdADUeT5oLrZdK1wZuN-AcF0RoR0A_iFTFul?gv=true"></iframe>
    </div>

</div>

</body>
</html>
