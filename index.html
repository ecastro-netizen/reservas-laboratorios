<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reservas de Laboratorios</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #eef2f7, #dbe5ff);
}

/* HEADER */
header {
    background: linear-gradient(90deg, #1e3a5f, #2b7cff);
    color: white;
    padding: 30px 20px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin-top: 8px;
    opacity: 0.9;
}

/* CONTENEDOR PRINCIPAL */
.wrapper {
    width: 95%;
    max-width: 1200px;
    margin: 30px auto;
}

/* BOTONES */
.botones {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.botones button {
    padding: 12px 25px;
    border: none;
    border-radius: 25px;
    background: white;
    color: #2b7cff;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
}

.botones button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
}

.botones button.activo {
    background: #2b7cff;
    color: white;
}

/* TARJETA */
.card {
    background: white;
    border-radius: 15px;
    padding: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

/* IFRAME */
iframe {
    width: 100%;
    height: 720px;
    border: none;
    border-radius: 10px;
}

/* TRANSICIÓN */
.lab {
    display: none;
    animation: fade 0.3s ease;
}

@keyframes fade {
    from {opacity: 0;}
    to {opacity: 1;}
}

/* FOOTER */
footer {
    text-align: center;
    padding: 15px;
    font-size: 13px;
    color: #555;
}
</style>

<script>
function mostrarLab(lab, boton) {

    document.getElementById("lab101").style.display = "none";
    document.getElementById("lab102").style.display = "none";
    document.getElementById("lab103").style.display = "none";

    document.querySelectorAll(".botones button").forEach(btn => {
        btn.classList.remove("activo");
    });

    document.getElementById(lab).style.display = "block";
    boton.classList.add("activo");
}
</script>

</head>

<body>

<header>
    <h1>Reservas de Laboratorios</h1>
    <p>Colegio Concepción Los Acacios · Plataforma de reservas</p>
</header>

<div class="wrapper">

```
<div class="botones">
    <button class="activo" onclick="mostrarLab('lab101', this)">Laboratorio 101</button>
    <button onclick="mostrarLab('lab102', this)">Laboratorio 102</button>
    <button onclick="mostrarLab('lab103', this)">Laboratorio 103</button>
</div>

<div class="card">

    <!-- LAB 101 -->
    <div id="lab101" class="lab" style="display:block;">
        <iframe src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2cbI0xfoGSxQocq_wpL__KLpnNvt9-xJwe4tusOPyl6ocssmiuQ0dyRABNyy9Fug7UovfwjtAT?gv=true"></iframe>
    </div>

    <!-- LAB 102 -->
    <div id="lab102" class="lab">
        <iframe src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ3NpC_fxMrUCFNd5Rq0pEFRk65xbhl6hSMPSxSO426cNTVU3BlxMiLqU1UhzfVv9WwoWDeHuV8L?gv=true"></iframe>
    </div>

    <!-- LAB 103 -->
    <div id="lab103" class="lab">
        <iframe src="AQUI_VA_TU_LINK_DEL_103"></iframe>
    </div>

</div>
```

</div>

<footer>
    Sistema de reservas · Área de Informática
</footer>

</body>
</html>
