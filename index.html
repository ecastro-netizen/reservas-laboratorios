<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Reservas de laboratorio</title>
<style>
body { font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:#f7f9fc; margin:0; padding:0; }
h1,h2 { text-align:center; color:#34495e; }
.container { max-width:1000px; margin:30px auto; background:white; padding:20px; border-radius:15px; box-shadow:0 5px 25px rgba(0,0,0,0.1);}
.form-group { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:15px; align-items:flex-end; }
input, select, button { padding:10px; border-radius:8px; border:1px solid #ccc; font-size:15px;}
button { background:#3498db; color:white; cursor:pointer; border:none; transition:0.3s;}
button:hover { background:#2980b9;}
.calendar { display:grid; grid-template-columns:100px repeat(7,1fr); border:1px solid #ccc; border-radius:8px; overflow:hidden; margin-top:20px; position:relative;}
.time-header { background:#2c3e50; color:white; padding:10px; text-align:center; font-weight:bold; border:1px solid #ccc; }
.day-header { background:#3498db; color:white; padding:10px; text-align:center; font-weight:bold; border:1px solid #ccc; }
.time-cell { border:1px solid #eee; padding:8px 6px; font-size:12px; text-align:right; color:#34495e; background:#f9fbff; }
.day-slot { border:1px solid #ccc; position:relative; font-size:13px; padding:4px; min-height:40px; background:white; }
.reservation { margin-top:2px; padding:2px 4px; border-radius:4px; font-size:12px; color:white; overflow:hidden; line-height:1.2; position:absolute; width:90%; left:5%; }
.lab1 { background:#e74c3c; }
.lab2 { background:#27ae60; }
.lab3 { background:#f1c40f; color:black; }
.header-controls { display:flex; justify-content:space-between; align-items:center; margin:10px 0; }
.legend { display:flex; justify-content:center; gap:20px; margin-bottom:10px; }
.legend div { display:flex; align-items:center; gap:5px; font-weight:bold; }
.legend span { display:inline-block; width:20px; height:20px; border-radius:4px; }
.hidden { display:none; }
.login-container { max-width:400px; margin:50px auto; background:white; padding:20px; border-radius:15px; box-shadow:0 5px 25px rgba(0,0,0,0.1); text-align:center; }
</style>
</head>
<body>

<div id="login" class="login-container">
<h2>Bienvenido al sistema de reservas</h2>
<button onclick="entrarComoProfesor()">Ingresar como Profesor</button>
<hr>
<h3>Administrador</h3>
<div class="form-group">
<input type="text" id="usuario" placeholder="Usuario">
<input type="password" id="clave" placeholder="Contraseña">
</div>
<button onclick="entrarComoAdmin()">Entrar como Administrador</button>
</div>

<div id="app" class="container hidden">
<h1>Sistema de Reservas de laboratorio</h1>

<h2>Seleccionar Laboratorio</h2>
<div class="form-group">
<select id="laboratorioSelect" onchange="seleccionarLaboratorio()">
<option value="">Seleccione laboratorio</option>
<option value="Laboratorio 1">Laboratorio 1</option>
<option value="Laboratorio 2">Laboratorio 2</option>
<option value="Laboratorio 3">Laboratorio 3</option>
</select>
<button onclick="mostrarTodosLaboratorios()">Mostrar los 3 laboratorios</button>
</div>

<div id="legend" class="legend hidden">
<div><span class="lab1"></span>Laboratorio 1</div>
<div><span class="lab2"></span>Laboratorio 2</div>
<div><span class="lab3"></span>Laboratorio 3</div>
</div>

<h2>Crear Reserva</h2>
<div class="form-group">
<label for="nombre">Nombre:</label>
<input type="text" id="nombre" placeholder="Nombre del profesor">
<label for="curso">Curso:</label>
<input type="text" id="curso" placeholder="Curso">
<label for="asignatura">Asignatura:</label>
<input type="text" id="asignatura" placeholder="Asignatura">
<label for="actividad">Actividad:</label>
<input type="text" id="actividad" placeholder="Actividad">
<label for="fecha">Fecha:</label>
<input type="date" id="fecha">
<div style="display:flex; gap:10px; align-items:center;">
<div>
<label for="horaInicio">Hora inicio:</label>
<input type="time" id="horaInicio" step="1800">
</div>
<div>
<label for="horaFin">Hora término:</label>
<input type="time" id="horaFin" step="1800">
</div>
</div>
<button onclick="crearReserva()">Reservar</button>
</div>

<h2>Calendario Semanal</h2>
<div class="header-controls">
<button onclick="cambiarSemana(-1)">&#8592; Semana anterior</button>
<h3 id="semanaAnio"></h3>
<button onclick="cambiarSemana(1)">Semana siguiente &#8594;</button>
</div>
<div id="calendar" class="calendar"></div>
</div>

<script>
let reservas = JSON.parse(localStorage.getItem('reservas')) || [];
let usuarios = JSON.parse(localStorage.getItem('usuarios')) || [{usuario:'admin',clave:'Catalina1',rol:'administrador'}];
let user = null;
let fechaActual = new Date();
let mostrarTodos = false;
let laboratorioSeleccionado = '';

function entrarComoProfesor(){ user={rol:'profesor',usuario:'profesor'}; document.getElementById('login').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); generarCalendario(); }
function entrarComoAdmin(){ const u=document.getElementById('usuario').value.trim(); const c=document.getElementById('clave').value.trim(); const encontrado=usuarios.find(x=>x.usuario===u && x.clave===c); if(!encontrado){ alert('Usuario o contraseña incorrecta'); return; } user=encontrado; document.getElementById('login').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); generarCalendario(); }

function guardar(){ localStorage.setItem('reservas', JSON.stringify(reservas)); localStorage.setItem('usuarios', JSON.stringify(usuarios)); }

function generarFranjas(start = "08:30", end = "18:00") { const slots=[]; let [h,m]=start.split(':').map(Number); const [eh,em]=end.split(':').map(Number); while(h<eh||(h===eh&&m<=em)){ slots.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`); m+=30; if(m>=60){m=0;h+=1;} } return slots; }

function generarCalendario(){
const calendario = document.getElementById('calendar');
const semanaAnio = document.getElementById('semanaAnio');
calendario.innerHTML='';

document.getElementById('legend').classList.toggle('hidden', !mostrarTodos);

const inicioSemana = new Date(fechaActual);
const day = inicioSemana.getDay()===0?7:inicioSemana.getDay();
inicioSemana.setDate(inicioSemana.getDate()-day+1);
const finSemana = new Date(inicioSemana);
finSemana.setDate(inicioSemana.getDate()+6);
semanaAnio.textContent = `Semana del ${inicioSemana.toLocaleDateString()} al ${finSemana.toLocaleDateString()}`;

const diasSemana=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const th=document.createElement('div'); th.className='time-header'; th.textContent='Hora'; calendario.appendChild(th);
for(let i=0;i<7;i++){ const f=new Date(inicioSemana); f.setDate(inicioSemana.getDate()+i); const dh=document.createElement('div'); dh.className='day-header'; dh.textContent=`${diasSemana[i]} ${String(f.getDate()).padStart(2,'0')}/${String(f.getMonth()+1).padStart(2,'0')}`; calendario.appendChild(dh); }

const slots=generarFranjas();
for(const slot of slots){
const tc=document.createElement('div'); tc.className='time-cell'; tc.textContent=slot; calendario.appendChild(tc);

for(let i=0;i<7;i++){
const cell=document.createElement('div'); cell.className='day-slot';
const f=new Date(inicioSemana); f.setDate(inicioSemana.getDate()+i);
const fechaStr=`${f.getFullYear()}-${String(f.getMonth()+1).padStart(2,'0')}-${String(f.getDate()).padStart(2,'0')}`;

let reservasSlot = reservas.filter(r=> r.fecha===fechaStr && (mostrarTodos || r.laboratorio===laboratorioSeleccionado) && !(slot<r.horaInicio || slot>=r.horaFin));

let offset=0;
reservasSlot.forEach(r=>{
const div=document.createElement('div');
div.classList.add('reservation');
div.textContent=`${r.nombre} (${r.horaInicio}-${r.horaFin}) - ${r.actividad}`;
if(r.laboratorio==='Laboratorio 1') div.classList.add('lab1');
else if(r.laboratorio==='Laboratorio 2') div.classList.add('lab2');
else div.classList.add('lab3');
div.style.top=`${offset*20}px`; offset++;
if(user.rol==='administrador'){ div.style.cursor='pointer'; div.title='Click para eliminar'; div.onclick=()=>{ if(confirm('Eliminar reserva?')) eliminarReserva(r); }; }
cell.appendChild(div);
});

calendario.appendChild(cell);
}
}
}

function cambiarSemana(delta){ fechaActual.setDate(fechaActual.getDate()+7*delta); generarCalendario(); }
function mostrarTodosLaboratorios(){ mostrarTodos=true; laboratorioSeleccionado=''; generarCalendario(); }
function seleccionarLaboratorio(){ laboratorioSeleccionado=document.getElementById('laboratorioSelect').value; mostrarTodos=false; generarCalendario(); }

function crearReserva(){
const nombre=document.getElementById('nombre').value.trim();
const curso=document.getElementById('curso').value.trim();
const asignatura=document.getElementById('asignatura').value.trim();
const actividad=document.getElementById('actividad').value.trim();
const laboratorio=document.getElementById('laboratorioSelect').value;
const fecha=document.getElementById('fecha').value;
const horaInicio=document.getElementById('horaInicio').value;
const horaFin=document.getElementById('horaFin').value;

if(!nombre||!curso||!asignatura||!actividad||!laboratorio||!fecha||!horaInicio||!horaFin){ alert('Completa todos los campos'); return; }
if(horaInicio>=horaFin){ alert('La hora de inicio debe ser menor a la hora de término'); return; }

const conflicto=reservas.some(r=>r.laboratorio===laboratorio && r.fecha===fecha && !(horaFin<=r.horaInicio || horaInicio>=r.horaFin));
if(conflicto){ alert('Existe una reserva que se cruza con ese horario'); return; }

reservas.push({nombre,curso,asignatura,actividad,laboratorio,fecha,horaInicio,horaFin});
guardar();
generarCalendario();
alert('Reserva creada');
['nombre','curso','asignatura','actividad','fecha','horaInicio','horaFin'].forEach(id=>document.getElementById(id).value='');
}

function eliminarReserva(r){ reservas=reservas.filter(x=>x!==r); guardar(); generarCalendario(); }
</script>
</body>
</html>
