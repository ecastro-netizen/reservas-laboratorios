<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reserva de Laboratorios</title>

<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    background: linear-gradient(135deg, #eef2f7, #d9e2ec);
}

/* HEADER */
header {
    background: linear-gradient(90deg, #1e3a5f, #2b7cff);
    color: white;
    padding: 25px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 1px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

/* BOTONES */
.botones {
    text-align: center;
    margin: 30px 0;
}

.botones button {
    padding: 14px 28px;
    margin: 10px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(135deg, #2b7cff, #174ecf);
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.botones button:hover {
    transform: translateY(-3px);
    background: linear-gradient(135deg, #174ecf, #0d3a9e);
    box-shadow: 0 6px 15px rgba(0,0,0,0.3);
}

/* CONTENEDOR */
.contenedor {
    width: 95%;
    max-width: 1200px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    border: 1px solid #ddd;
}

/* TITULO */
.titulo-lab {
    text-align: center;
    font-size: 20px;
    margin-bottom: 15px;
    color: #1e3a5f;
    font-weight: bold;
}

iframe {
    width: 100%;
    height: 650px;
    border: none;
    border-radius: 10px;
}
</style>

<script>
function mostrarLab(lab) {
    document.getElementById("lab101").style.display = "none";
    document.getElementById("lab102").style.display = "none";
    document.getElementById("lab201").style.display = "none";

    document.getElementById(lab).style.display = "block";
}
</script>

</head>

<body>

<header>
    Sistema de Reserva de Laboratorios
</header>

<div class="botones">
    <button onclick="mostrarLab('lab101')">Laboratorio -101</button>
    <button onclick="mostrarLab('lab102')">Laboratorio -102</button>
    <button onclick="mostrarLab('lab201')">Laboratorio 201 Prebásica</button>
</div>

<div class="contenedor">

    <!-- LAB -101 -->
    <div id="lab101">
        <div class="titulo-lab">Laboratorio -101</div>
        <iframe src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2cbI0xfoGSxQocq_wpL__KLpnNvt9-xJwe4tusOPyl6ocssmiuQ0dyRABNyy9Fug7UovfwjtAT?gv=true"></iframe>
    </div>

    <!-- LAB -102 -->
    <div id="lab102" style="display:none;">
        <div class="titulo-lab">Laboratorio -102</div>
        <iframe src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ3NpC_fxMrUCFNd5Rq0pEFRk65xbhl6hSMPSxSO426cNTVU3BlxMiLqU1UhzfVv9WwoWDeHuV8L?gv=true"></iframe>
    </div>

    <!-- LAB 201 -->
    <div id="lab201" style="display:none;">
        <div class="titulo-lab">Laboratorio 201 Prebásica</div>
        <iframe src="https://calendar.google.com/calendar/appointments/AcZssZ2aBxq1d8IHYZFs0d1sNss7uo9Kxksy7nGbjMA=?gv=true"></iframe>
    </div>

</div>

</body>
</html>
